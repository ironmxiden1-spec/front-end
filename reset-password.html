<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password - WIMPS</title>
    <link rel="stylesheet" href="login-page.css">
    <link rel="stylesheet" href="responsive.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>
    <section class="header">
        <a href="home-page.html">WIMPS</a>
        <div id="mobile"><a href="account.html" class="a">Account</a><i id="bar" class="fas fa-bars"></i></div>
    </section>

    <main class="auth-container">
        <div class="auth-box">
            <div class="form-box active">
                <h2>Reset Password</h2>
                <form id="resetPasswordForm">
                    <div class="form-group">
                        <label for="new-password">New Password</label>
                        <input type="password" id="new-password" minlength="6" required>
                    </div>
                    <div class="form-group">
                        <label for="confirm-password">Confirm Password</label>
                        <input type="password" id="confirm-password" minlength="6" required>
                    </div>
                    <button type="submit" class="btn-submit">Change Password</button>
                </form>
                <p class="toggle-text"><a href="login-page.html">Return to login</a></p>
            </div>
        </div>
    </main>

    <script src="config.js"></script>
    <script src="nav.js"></script>
    <script src="reset-password.js"></script>
</body>
</html>
